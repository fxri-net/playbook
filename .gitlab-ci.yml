stages:
  - test
  - pages

default:
  image: node:20.20.2
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.34.4 --activate
    - pnpm install --frozen-lockfile

# 变更集与技能版本门禁需要完整历史取变更基准
variables:
  GIT_DEPTH: "0"

test:
  stage: test
  script:
    - node scripts/verify.mjs

pages:
  stage: pages
  script:
    - DOCS_BASE=/playbook/ pnpm docs:build
    - rm -rf public
    - mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
